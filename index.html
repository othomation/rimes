<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rime — Analyse de schémas de rimes</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Martian+Mono:wdth,wght@75..112.5,400..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
<style id="focusStyle"></style>
</head>
<body>

<header class="top">
  <div class="logo">RIME</div>
  <div class="menu-wrap">
    <button class="doc-btn" id="docBtn" aria-haspopup="true" aria-expanded="false" aria-controls="docMenu" title="Textes sauvés">
      <span class="doc-title" id="docTitle">Sans titre</span>
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true" class="stroke"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
    </button>
    <div class="menu doc-menu" id="docMenu" hidden>
      <button class="menu-item" onclick="saveDoc()">Sauver <kbd>Ctrl+S</kbd></button>
      <button class="menu-item" onclick="newDoc()">Nouveau texte</button>
      <div class="menu-label">Textes sauvés</div>
      <div id="docList"></div>
      <div class="menu-sep"></div>
      <button class="menu-item" onclick="exportAll()">Exporter tous les textes <kbd>.json</kbd></button>
      <button class="menu-item" onclick="$('importInput').click()">Importer des textes… <kbd>.json .txt</kbd></button>
      <input type="file" id="importInput" accept=".json,.txt,application/json,text/plain" multiple hidden>
    </div>
  </div>
  <span class="doc-state" id="docState"></span>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="Surlignage du texte">
    <button data-mode="all" aria-pressed="true" title="Rimes de fin et rimes internes">Tout</button>
    <button data-mode="ends" aria-pressed="false" title="Rimes de fin seulement">Fins de vers</button>
    <button data-mode="text" aria-pressed="false" title="Le texte sans surlignage, sans bande de flow">Texte seul</button>
  </div>
  <button class="tog" id="flowBtn" aria-pressed="true" title="Afficher ou masquer la bande de flow, une case par syllabe">Flow</button>
  <button class="tog" id="vowBtn" aria-pressed="false" title="Colorer chaque syllabe de la bande par sa voyelle">Voyelles</button>
  <div class="menu-wrap">
    <button class="tog" id="exportBtn" aria-haspopup="true" aria-expanded="false" aria-controls="exportMenu">Exporter</button>
    <div class="menu menu-right" id="exportMenu" hidden>
      <button class="menu-item" onclick="downloadText()">Télécharger le texte <kbd>.txt</kbd></button>
      <button class="menu-item" id="shareItem" onclick="shareText()" title="Vers Notes, Mail, Drive… selon l'appareil">Partager…</button>
      <div class="menu-sep"></div>
      <button class="menu-item" onclick="copyReport()">Copier le rapport d'analyse</button>
      <button class="menu-item" onclick="downloadReport()">Télécharger le rapport <kbd>.txt</kbd></button>
    </div>
  </div>
  <button class="icon-btn" id="railBtn" aria-pressed="true" aria-label="Panneau d'analyse" title="Afficher ou masquer le panneau d'analyse">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" class="stroke"><path d="M2.5 3.5h13v11h-13Z M11.5 3.5v11"/></svg>
  </button>
</header>

<div class="body">
  <main class="editor" id="editor" aria-label="Paroles" data-mode="all" data-zoom="vow">
    <div class="ed-head">
      <span></span>
      <span class="h-text">
        <span title="# titre ou commentaire · [section] · (adlib) : ignorés par l'analyse&#10;ligne vide : nouvelle strophe">Paroles</span>
        <span class="legend" id="legend"></span>
      </span>
      <button class="grip" id="grip" aria-label="Largeur de la bande de flow" title="Glisser pour redimensionner la bande, double-clic pour la largeur auto"></button>
      <span class="h-flow" id="flowHint">Flow</span>
      <span class="h-meta">syl.</span>
    </div>
    <div class="ed-grid" id="edGrid">
      <div class="cur-band" id="curBand"></div>
      <div class="col col-gutter" id="gutter"></div>
      <div class="col col-text" id="textCol">
        <div class="text-inner">
          <div class="mirror" id="mirror" aria-hidden="true"></div>
          <textarea id="input" wrap="off" spellcheck="false" autocapitalize="off" aria-label="Paroles, un vers par ligne"
            placeholder="Écris ou colle tes paroles ici, un vers par ligne…&#10;&#10;# titre ou commentaire — ignoré&#10;[Couplet 1] — section, ignorée&#10;(adlib) — ignoré, même en fin de vers&#10;ligne vide — nouvelle strophe"></textarea>
        </div>
      </div>
      <div class="col col-handle" id="handleCol"></div>
      <div class="col col-strip" id="strip"></div>
      <div class="col col-meta" id="meta"></div>
    </div>
  </main>

  <aside class="rail" id="rail" aria-label="Analyse">
    <section class="rs">
      <h2>Schéma</h2>
      <div class="scheme" id="scheme"></div>
    </section>
    <section class="rs" id="curSection">
      <div class="cur-head">
        <h2 class="cur-title" id="curTitle">Vers</h2>
        <span class="cur-rime" id="curRime"></span>
        <span class="cur-level" id="curLevel"></span>
      </div>
      <div id="curLinks"></div>
      <div id="curSug"></div>
      <label class="search-label" for="searchInput">Chercher une rime</label>
      <div class="search">
        <input type="search" id="searchInput" placeholder="Un mot ou une fin de vers" autocomplete="off">
        <select id="searchSyl" title="Nombre de syllabes du mot proposé">
          <option value="">Syll.</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4+</option>
        </select>
        <select id="searchCat" title="Nature du mot proposé">
          <option value="">Nature</option>
          <option value="NOM">Noms</option>
          <option value="VER">Verbes</option>
          <option value="ADJ">Adjectifs</option>
          <option value="ADV">Adverbes</option>
        </select>
      </div>
      <div id="searchResults"></div>
    </section>
    <section class="rs">
      <h2>Familles</h2>
      <div class="fams" id="fams"></div>
    </section>
    <section class="rs rs-last">
      <h2>Sons qui reviennent</h2>
      <div id="sounds"></div>
    </section>
  </aside>
</div>

<footer class="foot">
  <span id="statVerses">0 vers</span>
  <span id="statIgnored"></span>
  <span id="statSyl"></span>
  <span id="statInt"></span>
  <span class="foot-status" id="status">phonétique Lexique 3.83</span>
</footer>

<div class="tip" id="tip" role="tooltip" hidden></div>

<script src="script.js?v=4"></script>
</body>
</html>
